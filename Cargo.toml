[package]
name = "cw-streamswap"
version = "0.1.5"
authors = ["Orkun Külçe <orkunkl@users.noreply.github.com>"]
edition = "2021"
exclude = [
  # Those files are rust-optimizer artifacts. You might want to commit them for convenience but they should not be part of the source code publication.
  "contract.wasm",
  "hash.txt",
]

[profile.release]
overflow-checks = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []
backtrace = []

[package.metadata.scripts]
optimize = """docker run --rm -v "$(pwd)":/code \
  --mount type=volume,source="$(basename "$(pwd)")_cache",target=/code/target \
  --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
  cosmwasm/rust-optimizer:0.15.1
"""

[dependencies]
cosmwasm-std = { version = "3.0.1", default-features = false, features = ["std", "stargate"] }
cosmwasm-schema = "3.0.1"
cw-controllers = "3.0.0"
cw-storage-plus = "3.0.0"
cw-utils = "3.0.0"
cw2 = "3.0.0"
schemars = "1.0.4"
serde = { version = "1.0.152", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.1" }
semver = "1.0.16"
ed25519-zebra = { version = "4.1.0", features = ["alloc"] }



[dev-dependencies]
cw-multi-test = { version = "3.0.1", features = ["cosmwasm_1_2"] }


